# Zet de serverfuncties automatisch online bij elke wijziging in supabase/functions.
# Eenmalig instellen in GitHub > Settings > Secrets and variables > Actions:
#   SUPABASE_ACCESS_TOKEN  (Supabase > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (de code in je projectadres: https://<ref>.supabase.co)
name: Serverfuncties uitrollen
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          for f in checkin add-proof rdw-lookup garage-plate ticket ticket-reply photo photo-moderate delete-account; do
            supabase functions deploy "$f" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done
