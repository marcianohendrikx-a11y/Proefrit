# Zet de app (map web/) online via GitHub Pages bij elke wijziging.
name: App online zetten
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lettertypen zelf hosten (geen verbinding met Google Fonts nodig)
        run: |
          set -e
          for p in barlow barlow-condensed; do
            d="$GITHUB_WORKSPACE/web/fonts/$p"; mkdir -p "$d" "/tmp/f/$p"
            (cd "/tmp/f/$p" && npm pack "@fontsource/$p@5" --silent && tar -xzf ./*.tgz)
            cp -r "/tmp/f/$p/package/files" "/tmp/f/$p/package/"*.css "$d/"
          done
          printf '@import url("barlow/400.css");\n@import url("barlow/500.css");\n@import url("barlow/600.css");\n@import url("barlow-condensed/600.css");\n@import url("barlow-condensed/700.css");\n' > "$GITHUB_WORKSPACE/web/fonts/fonts.css"
          ls "$GITHUB_WORKSPACE/web/fonts/barlow-condensed" | head -5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
